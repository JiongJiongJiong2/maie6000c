x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maie6000c
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maie6000c"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    profiles: ["starter", "observability"]
    build: .
    command: uvicorn services.ai.app.main:app --host 0.0.0.0 --port 8100
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${AI_BIND_HOST:-127.0.0.1}:${AI_HOST_PORT:-8100}:8100"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: /bin/sh -c "alembic upgrade head && exec uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/maie6000c
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MEDIA_ROOT: /data/media
      REFERENCE_ROOT: /data/reference
      MODEL_CACHE_ROOT: /data/models
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    volumes:
      - task_media:/data/media
      - "${REFERENCE_HOST_PATH:-./data/reference}:/data/reference:ro"
      - model_cache:/data/models
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    command: python -m services.worker.app.search_worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/maie6000c
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2.0}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-120}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-60}
      WEB_SEARCH_CALL_TIMEOUT_SECONDS: ${WEB_SEARCH_CALL_TIMEOUT_SECONDS:-12}
      WEB_SEARCH_MAX_DOWNLOADS: ${WEB_SEARCH_MAX_DOWNLOADS:-6}
      SAVED_INDEX_TIMEOUT_SECONDS: ${SAVED_INDEX_TIMEOUT_SECONDS:-300}
      SEARCH_AGENT_PROVIDER: ${SEARCH_AGENT_PROVIDER:-auto}
      SEARCH_AGENT_DDGS_BACKEND: ${SEARCH_AGENT_DDGS_BACKEND:-bing}
      SEARCH_AGENT_DOMAINS: ${SEARCH_AGENT_DOMAINS:-[]}
      SEARCH_AGENT_MODE: ${SEARCH_AGENT_MODE:-web}
      SEARCH_AGENT_USE_MODEL: ${SEARCH_AGENT_USE_MODEL:-true}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.82}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      MEME50_PROVIDER_POLICY: hkust-deepseek-v1
      MEME50_VISION_PROVIDER: hkust
      MEME50_HKUST_MODEL: ${MEME50_HKUST_MODEL:-gemini-2.5-flash-lite}
      MEME50_HKUST_API_KEY: ${MEME50_HKUST_API_KEY:-${HKUST_API_KEY:-}}
      MEME50_DEEPSEEK_MODEL: ${MEME50_DEEPSEEK_MODEL:-deepseek-flash}
      MEME50_KEYWORD_PROVIDER: deepseek
      MEME50_REVERSE_IMAGE_PROVIDER: disabled
      MEME50_VERIFY_ENTITIES: ${MEME50_VERIFY_ENTITIES:-true}
      MEME50_TIMEOUT_SECONDS: ${MEME50_TIMEOUT_SECONDS:-180}
      MEME50_CALL_TIMEOUT_SECONDS: ${MEME50_CALL_TIMEOUT_SECONDS:-18}
      MEME50_MAX_SEARCH_CALLS: ${MEME50_MAX_SEARCH_CALLS:-16}
      MEME50_MAX_MODEL_CALLS: ${MEME50_MAX_MODEL_CALLS:-3}
      MEME50_MAX_QUERIES: ${MEME50_MAX_QUERIES:-6}
      MEME50_MAX_SOURCES: ${MEME50_MAX_SOURCES:-500}
      MEME50_MAX_PREVIEWS: ${MEME50_MAX_PREVIEWS:-250}
      MEME50_MAX_ORIGINALS: ${MEME50_MAX_ORIGINALS:-120}
      MEME50_MAX_PAGES: ${MEME50_MAX_PAGES:-40}
      MEME50_MAX_BYTES: ${MEME50_MAX_BYTES:-536870912}
      MEME50_MAX_DISK_BYTES: ${MEME50_MAX_DISK_BYTES:-536870912}
      MEME50_MAX_REDIRECTS: ${MEME50_MAX_REDIRECTS:-120}
      MEME50_FETCH_URL: http://media-fetch:8120
      MEME50_DNS_MODE: ${MEME50_DNS_MODE:-system}
      MEME50_CONCURRENCY: ${MEME50_CONCURRENCY:-6}
      MEME50_MINIMUM_SCORE: ${MEME50_MINIMUM_SCORE:-0.55}
      MAX_CANDIDATE_BYTES: ${MAX_CANDIDATE_BYTES:-26214400}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-7}
      MEDIA_ROOT: /data/media
      REFERENCE_ROOT: /data/reference
      MODEL_CACHE_ROOT: /data/models
    networks: [default, media_egress]
    volumes:
      - task_media:/data/media
      - "${REFERENCE_HOST_PATH:-./data/reference}:/data/reference:ro"
      - model_cache:/data/models
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${SEARCH_WORKER_STOP_GRACE_PERIOD:-330s}
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      media-fetch:
        condition: service_healthy

  media-fetch:
    build:
      context: .
      target: media-fetch
    networks: [media_egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8120/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  starter-worker:
    profiles: ["starter"]
    build: .
    command: python -m services.worker.app.main
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/maie6000c
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2.0}
      WORKER_REQUEST_TIMEOUT_SECONDS: ${WORKER_REQUEST_TIMEOUT_SECONDS:-20.0}
      AI_SERVICE_URL: http://ai:8100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${STARTER_WORKER_STOP_GRACE_PERIOD:-30s}
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_HOST:-127.0.0.1}:9090:9090"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  postgres_data:
  task_media:
  model_cache:
  prometheus_data:

networks:
  media_egress:
    driver: bridge
