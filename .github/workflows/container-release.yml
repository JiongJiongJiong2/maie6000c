name: Container release

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and smoke test container images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: container-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      API_IMAGE: memeretrieve-ci/api:git-${{ github.sha }}
      WORKER_IMAGE: memeretrieve-ci/worker:git-${{ github.sha }}
      FETCH_IMAGE: memeretrieve-ci/media-fetch:git-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Define one build graph for the three targets
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/container-release.hcl" <<EOF
          group "default" {
            targets = ["api", "worker", "media-fetch"]
          }
          target "common" {
            context = "."
            dockerfile = "Dockerfile"
            platforms = ["linux/amd64"]
            cache-from = ["type=gha,scope=memeretrieve-containers-amd64"]
            labels = {
              "org.opencontainers.image.source" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
              "org.opencontainers.image.revision" = "$GITHUB_SHA"
            }
          }
          target "api" {
            inherits = ["common"]
            target = "api"
            tags = ["$API_IMAGE"]
          }
          target "worker" {
            inherits = ["common"]
            target = "worker"
            tags = ["$WORKER_IMAGE"]
            cache-to = ["type=gha,scope=memeretrieve-containers-amd64,mode=max,ignore-error=true"]
          }
          target "media-fetch" {
            inherits = ["common"]
            target = "media-fetch"
            tags = ["$FETCH_IMAGE"]
          }
          EOF

      - name: Build and load exact test images
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: ${{ runner.temp }}/container-release.hcl
          load: true

      - name: Smoke test the built images
        shell: bash
        run: |
          image_ids() {
            for image in "$API_IMAGE" "$WORKER_IMAGE" "$FETCH_IMAGE"; do
              docker image inspect --format '{{.Id}}' "$image" || return
            done
          }
          image_ids > "$RUNNER_TEMP/test-image-ids"
          python scripts/smoke_compose_release.py \
            --api-image "$API_IMAGE" --worker-image "$WORKER_IMAGE" --fetch-image "$FETCH_IMAGE"
          image_ids | diff - "$RUNNER_TEMP/test-image-ids"

      - name: Archive the smoke-tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/tested-images"
          mkdir "$release_dir"
          cp "$RUNNER_TEMP/test-image-ids" "$release_dir/image-ids.txt"
          cd "$release_dir"
          docker save "$API_IMAGE" "$WORKER_IMAGE" "$FETCH_IMAGE" | zstd -T0 -3 -o images.tar.zst
          sha256sum images.tar.zst image-ids.txt > SHA256SUMS

      - name: Pass the exact tested images to the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-images-${{ github.sha }}
          path: ${{ runner.temp }}/tested-images/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  verify-main-ci:
    name: Require successful tests on the same main commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for Python and applicable browser CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          workflows=(ci.yml)
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" ||
             ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- web/ .github/workflows/web.yml; then
            workflows+=(web.yml)
          fi

          deadline=$((SECONDS + 1500))
          for workflow in "${workflows[@]}"; do
            conclusion=""
            while (( SECONDS < deadline )); do
              conclusion=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -F per_page=20 \
                --jq '.workflow_runs | max_by(.run_number) | .conclusion // ""')
              case "$conclusion" in
                success) break ;;
                "") sleep 15 ;;
                *) echo "::error::$workflow finished with $conclusion for $GITHUB_SHA"; exit 1 ;;
              esac
            done
            if [[ "${conclusion:-}" != success ]]; then
              echo "::error::Timed out waiting for $workflow on $GITHUB_SHA"
              exit 1
            fi
          done

  publish-main:
    name: Publish validated main images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-smoke, verify-main-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: memeretrieve-ghcr-main
      cancel-in-progress: false
    steps:
      - name: Download the tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-images-${{ github.sha }}
          path: ${{ runner.temp }}/tested-images

      - name: Verify and load the tested images
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tested-images"
          sha256sum -c SHA256SUMS
          zstd -dc images.tar.zst | docker load
          for target in api worker media-fetch; do
            image="memeretrieve-ci/$target:git-$GITHUB_SHA"
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            [[ "$revision" == "$GITHUB_SHA" ]] || exit 1
            docker image inspect --format '{{.Id}}' "$image" || exit 1
          done | diff - image-ids.txt

      - name: Publish the tested images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          manifest_error="$RUNNER_TEMP/registry-manifest-error"
          for target in api worker media-fetch; do
            local_tag="memeretrieve-ci/$target:git-$GITHUB_SHA"
            sha_tag="$repository-$target:git-$GITHUB_SHA"
            local_id=$(docker image inspect --format '{{.Id}}' "$local_tag")
            if manifest=$(docker manifest inspect "$sha_tag" 2>"$manifest_error"); then
              if [[ $(jq -er '.config.digest' <<<"$manifest") != "$local_id" ]]; then
                echo "::error::Refusing to overwrite an existing SHA tag with a different image"
                exit 1
              fi
            elif grep -Eqi 'manifest unknown|name unknown|no such manifest|: not found([[:space:]]|$)|^not found$' "$manifest_error"; then
              docker tag "$local_tag" "$sha_tag"
              docker push "$sha_tag"
            else
              cat "$manifest_error" >&2
              exit 1
            fi
          done

          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "The SHA images are published. Main advanced before tag promotion."
            exit 0
          fi
          for target in api worker media-fetch; do
            local_tag="memeretrieve-ci/$target:git-$GITHUB_SHA"
            main_tag="$repository-$target:main"
            docker tag "$local_tag" "$main_tag"
            docker push "$main_tag"
            printf -- '- %s\n' "$repository-$target:git-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
